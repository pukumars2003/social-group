name: Save Location Data

on:
  repository_dispatch:
    types: [save_location_data]

jobs:
  save-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save data to JSON
        run: |
          mkdir -p data
          # The payload is passed in github.event.client_payload
          echo '${{ toJson(github.event.client_payload) }}' > data/results.json
          
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/results.json
          git commit -m "Update location data [skip ci]" || echo "No changes to commit"
          git push
